name: Build e release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para publicar (ex.: v1.1.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validar formato da tag
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Use uma tag estavel no formato vMAJOR.MINOR.PATCH.'
          }

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Conferir versao do aplicativo
        run: |
          python -c "import os; from app.version import VERSION; expected = 'v' + VERSION; actual = os.environ['RELEASE_TAG']; assert actual == expected, f'Tag {actual} difere da versao {expected} em app/version.py'"
          if ($LASTEXITCODE -ne 0) { throw 'A tag e a versao do aplicativo precisam ser iguais.' }

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias Python
        run: python -m pip install -r requirements-build.txt -r requirements-dev.txt

      - name: Instalar dependencias da interface
        working-directory: frontend
        run: npm ci

      - name: Testar interface
        working-directory: frontend
        run: npm test

      - name: Compilar interface
        working-directory: frontend
        run: npm run build

      - name: Testar aplicativo
        run: python -m unittest discover -s tests -v

      - name: Gerar executavel e checksum (inclui teste TLS)
        run: ./scripts/build-windows.ps1

      - name: Publicar release com os dois arquivos
        run: |
          gh release create $env:RELEASE_TAG dist/DocsLocal.exe dist/DocsLocal.exe.sha256 --verify-tag --draft --title "Docs Local $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar o rascunho da release. Confira se a release ja existe.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Os arquivos foram enviados, mas a release permanece como rascunho. Publique-a pela interface do GitHub.' }
